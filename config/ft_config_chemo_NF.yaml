# Neutropenic Fever (NF) downstream fine-tuning configuration.
#
# The final thesis workflow initializes each NF fold from the shared,
# patient-excluded GC pretraining checkpoint. Individual thesis experiments
# override window, sequence length, batching ratio, initialization, and output
# names through Hydra command-line overrides or dedicated experiment configs.

cohort_name: NF
seed: 2021

# Default downstream observation window.
# False: full 14-day window [0, 336] hours.
# True: last-7-day window (168, 336] hours.
USE_7_DAY_WINDOW: True

# Fold-specific package path. Batch scripts override this for folds 0--4.
data_path: data/pre_processed/chemo_NF_fold_0.pkl

# Shared GC checkpoint. Required when use_pretrained_weights is true.
pt_model_weights_path: pretrained_models/Chemo/EMIT_MAE/GC/EMIT_Chemo_GC_128d.weights.h5
use_pretrained_weights: true

# Fixed master vocabulary shared with GC pretraining.
top_features_path: data/raw/mimic_chemo/top_features/mimic_top100_features.pkl
V: 102

# Architecture.
max_seq_length: 1035
d: 128
N: 2
he: 8
dropout: 0.4

# Fine-tuning optimization.
batch_size: 32
learning_rate: 0.00005
weight_decay: 0.0001
epochs: 1
patience: 10

# Labeled-data fraction and repeat count used in the thesis experiments.
lds: [100]
repeats: 1

# Batching.
# Options: random_shuffle, cycle_balanced.
batching_strategy: cycle_balanced

# Used only by cycle_balanced.
# 0.50 -> 1:1; 0.33 -> 1:2; 0.25 -> 1:3.
pos_ratio: 0.25

# Output names are overridden by experiment scripts.
file_name: nf_finetuning_fold
results_path: results/Chemo/EMIT_MAE/testing/NF_frequency/${file_name}.pkl

hydra:
  run:
    dir: logs/hydra_logs/Chemo_NF/FT/${now:%Y-%m-%d_%H-%M-%S}