# General Cancer (GC) self-supervised pretraining configuration.
#
# Final thesis workflow:
#   1. Construct the patient-excluded GC cohort from authorized MIMIC-IV data.
#   2. Generate GC-only pretraining tensors and event-position masks.
#   3. Pretrain the EMIT-based model on GC.
#   4. Use the saved GC checkpoint to initialize AP/NF fine-tuning folds.
#
# All paths reference restricted MIMIC-IV-derived files and must be supplied
# locally by credentialed users. Do not commit data, checkpoints, or results.

cohort_name: GC
seed: 2021

# Observation-window and pretraining-objective settings.
# False: full 14-day observation window [0, 336] hours.
# True: last-7-day observation window (168, 336] hours.
USE_7_DAY_WINDOW: false

# False: Pure MAE with zero-filled forecasting targets.
# True: Hybrid reconstruction--forecasting pretraining, where (312, 336]
# hours form the forecasting target window.
USE_FORECASTING_ABLATION: false

# Target-Mask Alignment mode.
# Options: val_var_time, val_var, var_time, val_time, val, var, time.
target_mode: val_var_time

# Reconstruction-loss mode.
# Options:
#   standard
#   inverse_frequency
#   proportional_frequency
#   temporal_weighted
#   relative_temporal
#   clinical_regularized
loss_type: inverse_frequency

# Event-position masking strategy.
# Options: rate_of_change, random, clinical, frequency, temporal.
masking_strategy: rate_of_change

# Masking probabilities.
random_mask_prob: 0.50
pathological_mask_prob: 0.60
normal_mask_prob: 0.40
rare_mask_prob: 0.60
common_mask_prob: 0.40
recent_mask_prob: 0.60
old_mask_prob: 0.40

# Rate-of-Change masking parameters.
# Events with |delta value / delta time| > mask_threshold receive masking
# probability 1 - insignificant_prob; all other observed events receive
# insignificant_prob.
mask_threshold: 0.001
insignificant_prob: 0.40

# Optional frequency-weight files used only for frequency
# loss experiments. These files are derived from the full AP/NF packages and
# have the limitation documented in the thesis. Set the relevant path when a
# frequency loss is selected; otherwise leave null.
inverse_frequency_weights_path: null
proportional_frequency_weights_path: null

# Restricted local input files generated by the GC formatter.
data_path: data/pre_training/pretraining_data_chemo_GC.npz
mask_path: data/pre_training/chemo_GC_event_masks.npz

# Architecture.
max_len: 1035
V: 102
d: 128
N: 2
he: 8
dropout: 0.2

# Optimization.
batch_size: 32
learning_rate: 0.0005
weight_decay: 0.0
epochs: 1
patience: 10
error_coefficient: 8

# Computational training budget. This is the number of GC admission sequences
# sampled per epoch, not the GC cohort size.
samples_per_epoch: 3200

# Restricted local checkpoint output.
model_name: pretrained_models/Chemo/EMIT_MAE/GC/EMIT_Chemo_GC_128d

hydra:
  run:
    dir: logs/hydra_logs/Chemo_GC/PT/${now:%Y-%m-%d_%H-%M-%S}